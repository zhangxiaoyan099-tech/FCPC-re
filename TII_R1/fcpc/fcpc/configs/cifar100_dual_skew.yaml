{
  "seed": 42,
  "dataset": {
    "name": "cifar100",
    "num_classes": 100,
    "input_channels": 3,
    "root": "./data",
    "download": false
  },
  "model": {
    "name": "resnet18"
  },
  "federated": {
    "num_clients": 10,
    "clients_per_round": 10,
    "rounds": 100,
    "local_epochs": 10,
    "batch_size": 64,
    "aggregation": "weighted",
    "device": "auto"
  },
  "partition": {
    "mode": "dual_skew",
    "alpha": 0.05,
    "alpha_grid": [0.05, 0.1, 0.5],
    "quantity_skew": true
  },
  "algorithm": {
    "name": "fedavg"
  },
  "fcpc": {
    "enabled": true,
    "lambda_jsdn": 0.3,
    "beta": 0.2,
    "epsilon": 1.0,
    "metric": "jsdn"
  },
  "optimizer": {
    "name": "sgd",
    "lr": 0.01
  },
  "logging": {
    "output_dir": "outputs/logs",
    "checkpoint_dir": "outputs/checkpoints",
    "run_name": "cifar100_dual_skew_fcpc"
  }
}

