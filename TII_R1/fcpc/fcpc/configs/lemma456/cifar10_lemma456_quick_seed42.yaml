seed: 42

dataset:
  name: cifar10
  num_classes: 10
  input_channels: 3
  root: ./data
  download: false
  augment: false
  normalize: true

model:
  name: resnet18

federated:
  num_clients: 10
  batch_size: 128
  device: cuda:0
  num_workers: 4
  pin_memory: true

partition:
  mode: dual_skew
  alpha: 0.1
  quantity_min_fraction: 0.25

evaluation:
  validation_fraction: 0.1
  validation_seed: 10042

audit:
  checkpoints: [1, 10, 25, 50]
  panels: [raw]
  # First verify the primary maximum-weight-JS matching mechanism.  Pairing
  # ablations belong in a separate experiment after the proof conditions pass.
  strategies: [optimal]
  batch_seeds: [100, 101, 102, 103, 104]
  random_pairing_seeds: [0, 1, 2]
  epsilon: 1.0
  ldp_seed: 20042
  lambda_jsdn: 0.3
  # Match the mini-batch training objective that produced the historical
  # updates.  This removes train-BN versus eval-BN objective mismatch.
  gradient_model_mode: train
  gradient_batch_size: 16
  gradient_max_batches: 20
  gradient_num_workers: 4
  validation_max_batches: 20
  # L=0 isolates Lemma 6's first-order term.  Positive values are sensitivity
  # diagnostics only until an L-smooth bound is independently justified.
  smoothness_L_values: [0.0, 0.1, 1.0]
  q_candidate: 0.0
  output_dir: outputs/lemma456_quick_seed42
  checkpoint_dir: outputs/lemma456_quick_seed42/neutral_checkpoints

  # A controlled fixed-step, plain-SGD history makes gamma=lr*steps known.
  warmup:
    batch_size: 16
    local_epochs: 1
    max_batches_per_client: 6
    require_equal_steps: true
    # Warmup must learn valid BatchNorm running statistics.  They are frozen
    # only during the matched one-round counterfactual replays.
    freeze_batchnorm_stats: false
    num_workers: 4
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.0
      weight_decay: 0.0

  replay:
    batch_size: 16
    local_steps: 6
    num_workers: 0
    beta: 0.2
    beta_schedule: cosine_decay
    min_beta: 0.0
    beta_schedule_rounds: 200
    partner_weighting: uniform
    update_rule: proximal
    grad_center_mix: 1.0
    grad_center_step_scale: 0.5
    center_max_relative_distance: 0.05
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.0
      weight_decay: 0.0
